# ==============================================================================
# Nginx Reverse Proxy Configuration for FilmHouse Streaming Engine
# Place in: /etc/nginx/sites-available/filmhouse-stream
# Link to:  /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    server_name filmhouse-stream.duckdns.org;

    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Crucial HTTP 206 Range Request Pass-through
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # CRITICAL STREAMING SETTING: Disable Buffering
        # Prevents Nginx from storing gigabytes of video chunks in RAM/disk
        proxy_buffering off;
        proxy_request_buffering off;

        # Keep-Alive & Long Video Streaming Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
